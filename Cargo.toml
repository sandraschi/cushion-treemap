[package]
name = "cushion-treemap"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sandraschi/cushion-treemap"
description = "UI-agnostic squarified hierarchical cushion-treemap layout: enveloping containers, depth-limited recursion, hover/zoom-ready tiles. This crate only computes rectangles; your renderer draws them."
keywords = ["treemap", "squarified", "visualization", "layout", "cushion"]
categories = ["visualization", "algorithms"]
exclude = ["target"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
